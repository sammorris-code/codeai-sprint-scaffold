# Traefik dynamic configuration for the standards API, for a file provider.
#
# Drop this in the directory your Traefik file provider watches and adjust the
# host rule, the middleware you keep, and the TLS block. Nothing here is
# secret; the password hash is a placeholder you replace.
#
# It assumes Traefik and the api container share a Docker network, so the
# service below is addressed by container name and the api publishes no host
# port at all. If your Traefik is not in Docker, see "If Traefik is not a
# container" at the bottom.

http:
  routers:
    standards-api:
      rule: "Host(`standards.your-nas.example`)"
      entryPoints:
        - websecure
      service: standards-api
      middlewares:
        # Covers the tool and the API together, because the service serves
        # both and they share an origin. Swap to standards-allowlist if you
        # would rather gate by address than by password.
        - standards-auth
        # - standards-allowlist
      tls: {}
      # If Traefik issues your certificates rather than you supplying them:
      # tls:
      #   certResolver: your-resolver

  services:
    standards-api:
      loadBalancer:
        servers:
          # Container name and internal port. Not a host port - the api
          # publishes none, so Traefik is the only way in.
          - url: "http://standards-api:8000"

  middlewares:
    # An address allowlist, if the people using this have stable addresses and
    # you would rather not hand out a password.
    standards-allowlist:
      ipAllowList:
        sourceRange:
          - "203.0.113.0/24"    # replace: your office or home range
          - "198.51.100.42/32"  # replace: your colleague

    # Basic auth. Generate the line with:
    #   htpasswd -nbB reviewer 'a long password'
    #
    # In a file provider like this one, write the hash verbatim. Do NOT double
    # the dollar signs - that escaping is only needed in Docker labels, where
    # Compose would otherwise interpolate them.
    standards-auth:
      basicAuth:
        users:
          - "reviewer:$2y$05$REPLACE.THIS.WITH.A.REAL.BCRYPT.HASH"

# ---------------------------------------------------------------------------
# Why basic auth works here, when it usually would not
# ---------------------------------------------------------------------------
#
# Put basic auth in front of an API that a page on ANOTHER origin calls, and
# every write breaks. The browser sends a preflight OPTIONS first, preflights
# carry no credentials by design, basic auth answers 401, and the write fails
# as a CORS error that looks nothing like an authentication problem. The page
# cannot send the header itself either - that would mean a password committed
# to a public repository.
#
# It works here because the service serves the review tool as well as the API,
# so there is only one origin:
#
#   https://standards.your-nas.example/tools/standards-mapper/   the tool
#   https://standards.your-nas.example/api/...                   the API
#
# The viewer is prompted once when they open the tool, and the browser attaches
# those credentials to every call the page makes afterwards. No preflight, no
# password in the repository, one middleware covering both.
#
# Two things this depends on, so do not undo them casually:
#
#   - loader.js uses base '../../api', a relative path. An absolute URL to the
#     same host would still be same-origin, but a different HOST - a laptop
#     checkout, or the GitHub Pages copy - calling this one would not be, and
#     is the broken case above.
#   - app/main.py mounts the site at "/". If that mount is removed, the tool
#     has to be served from somewhere else, and this whole arrangement is back
#     to being cross-origin.
#
# ---------------------------------------------------------------------------
# If Traefik is not a container
# ---------------------------------------------------------------------------
#
# Address the api by host and port instead, and give it a host binding again -
# set API_BIND=127.0.0.1 in .env (its default) if Traefik runs on the same
# machine, and point the service at:
#
#   - url: "http://127.0.0.1:8000"
#
# Never set API_BIND=0.0.0.0. That publishes the unauthenticated API beside
# the authenticated route, and anyone who finds the port skips the middleware.
