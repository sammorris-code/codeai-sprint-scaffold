# Checks the data contract in contract/.
#
# This is NOT a build step. It changes nothing about what gets published, and it
# adds no install for anybody. deploy-site.yml and pr-preview.yml are untouched.
# All this does is fail a pull request that breaks the contract, so the interface
# work and the store work cannot drift apart without somebody noticing.
#
# It runs on contract/ changes only, so nobody editing a page waits for it.

name: Validate contract

on:
  pull_request:
    paths: ['contract/**', '.github/workflows/validate-contract.yml']
  push:
    branches: [main]
    paths: ['contract/**', '.github/workflows/validate-contract.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No setup-python step and no pip install. The runner's python3 is enough,
      # and validate.py imports the standard library only. Keep it that way: the
      # moment this needs a dependency, every contributor needs one too.
      - name: Check the fixtures against the schemas
        run: python3 contract/validate.py
