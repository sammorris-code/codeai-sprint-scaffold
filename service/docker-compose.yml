# The prototype store and its API.
#
#   docker compose -f service/docker-compose.yml up
#
# Postgres comes up, the schema is applied, the sample data is loaded, and the
# API answers on http://localhost:8000. Nothing else to install.
#
# This is a prototype. Two things must change before it holds anything real:
# the password below, and the open CORS setting in app/main.py.

name: standards

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: standards
      POSTGRES_PASSWORD: standards
      POSTGRES_DB: standards
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Anything in this folder runs once, in name order, on first start.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standards -d standards"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Loads the sample data, then exits. The API waits for it to finish, so
  # bringing the stack up gives you something to look at rather than an empty
  # database.
  seed:
    build:
      context: ..
      dockerfile: service/Dockerfile
    environment:
      DATABASE_URL: postgresql://standards:standards@db:5432/standards
    command: ["python", "-m", "service.load_fixtures"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: service/Dockerfile
    environment:
      DATABASE_URL: postgresql://standards:standards@db:5432/standards
      # Boundary drafting, and nothing else, needs this. Empty is fine: the
      # service starts, and characterizing a document works, without it.
      #
      # Compose fills it from your shell, or from service/.env if that file
      # exists. service/.env is git-ignored. Never put the key in this file:
      # this file IS committed, and the repository is public.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  pgdata:
