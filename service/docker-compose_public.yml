# The store and its API, on a host someone else can reach.
#
# `docker-compose.yml` is the local one: it seeds demo data on every start and
# publishes Postgres to your laptop, both of which are right for a laptop and
# wrong for a shared box. This file is the same stack with those two habits
# removed. Run one or the other, never both against the same data.
#
#   docker compose -f docker-compose_public.yml up -d
#
# The host needs two files and nothing else: this one and your dump. Nothing is
# built there - the image is pulled from GitHub's registry, and a pg_dump
# carries its own schema.
#
# ---------------------------------------------------------------------------
# Standing it up
# ---------------------------------------------------------------------------
#
# 1. Put a real password in a .env file beside this one. That file is
#    git-ignored; this one is committed and the repository is public.
#
#      POSTGRES_PASSWORD=<something long>
#
# 2. Make the image reachable. It is published to ghcr.io by the workflow in
#    .github/workflows/publish-image.yml, and a new package is private, so do
#    ONE of these once:
#
#      - set the package public in the repository's Packages settings, or
#      - on the host: docker login ghcr.io -u <you>  (a token with read:packages)
#
# 3. Bring it up. The database starts empty - that is expected.
#
#      docker compose -f docker-compose_public.yml pull
#      docker compose -f docker-compose_public.yml up -d
#
# 4. On your laptop, dump what you have. Write it INSIDE the container and
#    copy it out - do not redirect with `>`:
#
#      docker compose -f service/docker-compose.yml exec -T db \
#        pg_dump -U standards -d standards --clean --if-exists -f /tmp/dump.sql
#      docker compose -f service/docker-compose.yml cp db:/tmp/dump.sql ./dump.sql
#
#    `> dump.sql` looks equivalent and is not: PowerShell 5.1 redirects as
#    UTF-16, psql reads every other byte as a command, and you get a screen of
#    `invalid command \th` plus an error about encoding that never mentions
#    the shell. The two lines above are the same on every platform.
#
#    Check before copying: the file should be tens of KB and start with `--`.
#
# 5. Copy dump.sql to the host, beside this file, and load it:
#
#      docker compose -f docker-compose_public.yml --profile restore up restore
#
#    Re-runnable: drop a newer dump.sql in and run it again. See the `restore`
#    service below for why it is a profile rather than an init script.
#
#    If you move the file with WinSCP or similar, set it to binary mode.
#
# 6. Put it behind Traefik. Copy traefik/standards.toml into the directory
#    your file provider watches and set the Host rule. Read its header first:
#    the entrypoint name, the TLS block and the middleware are conventions that
#    differ between installations, and copying them from a rules file that
#    already works on your proxy saves an hour of 404s. The api joins Traefik's
#    network and publishes nothing, so that route is the only way to reach it.
#
# 7. Use the interface at https://<your host>/tools/standards-mapper/. The
#    service serves the site as well as the API, so the tool is already there
#    and already shares the API's origin - which is what lets basic auth work
#    at all. In loader.js the SOURCE block becomes:
#
#      mode: 'api',
#      base: '../../api',
#
# ---------------------------------------------------------------------------
# Three deliberate differences from the local file
# ---------------------------------------------------------------------------
#
# **No ANTHROPIC_API_KEY.** Reviewing needs reads and writes, not drafting.
# Without the key the service starts and everything a reviewer touches works;
# only boundary drafting fails, with a clear error. With the key, an
# unauthenticated ingest endpoint is a way for a stranger to spend your money.
# Ingest on your laptop, move the result here.
#
# **Postgres is not published.** The api reaches it over the compose network.
# A published 5432 on a box with a public address is the database open to the
# internet, and the local file's password is committed in a public repository.
#
# **Seeding is opt-in.** In the local file the seed step runs on every `up` and
# loads the demo fixtures, which deletes everything else. That is how the
# Oklahoma set was lost once already. Here it only runs if you ask:
#
#      docker compose -f docker-compose_public.yml --profile demo up seed
#
# ---------------------------------------------------------------------------
# Where the authentication lives
# ---------------------------------------------------------------------------
#
# Not here. The API has five write endpoints, none of them authenticated, and
# `allow_origins=["*"]` in app/main.py lets any page call them. Anyone who can
# reach it can approve a run.
#
# So it publishes no host port at all, and Traefik is the only route in. The
# middleware on that route is the authentication - see traefik/standards.toml,
# which also explains why basic auth works here when in front of an API it
# usually does not, and how to read a 404 against a 502 when it does not.

name: standards-public

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: standards
      # No default. Compose refuses to start if .env does not set it, which is
      # the point: a password with a fallback is a password nobody changes.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: standards
    # No `ports:` on purpose. See above.
    volumes:
      - pgdata:/var/lib/postgresql/data
      # No schema mount either. The local file applies db/schema.sql on first
      # start; here the dump you restore brings its own schema, and leaving
      # the mount out is what frees the host from needing a checkout.
      # If you ever want an empty schema instead of a dump, run:
      #   docker compose -f docker-compose_public.yml exec -T db \
      #     psql -U standards -d standards < db/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standards -d standards"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    # A finished image, pulled. Nothing is built on the host.
    #
    # This began as a build from a git URL, on the theory that it saved the
    # host a checkout. It does not work: a NAS builder has no `git` binary, so
    # it cannot fetch a git context, and it says so in a wall of BuildKit text
    # that never names the cause. Pulling is better anyway - no toolchain on
    # the host, nothing to clone, and the same bytes everywhere.
    #
    # `main` follows the default branch. Pin an exact commit when it matters
    # which version is running: IMAGE_TAG=sha-1a2b3c4 in .env.
    image: ghcr.io/sammorris-code/codeai-sprint-scaffold:${IMAGE_TAG:-main}
    # Published by .github/workflows/publish-image.yml. The package is private
    # until you make it public in the repository's Packages settings; until
    # then the host needs `docker login ghcr.io`.
    #
    # To update: docker compose -f docker-compose_public.yml pull && ... up -d
    environment:
      DATABASE_URL: postgresql://standards:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/standards
      # ANTHROPIC_API_KEY is absent on purpose. See the note above.
    # Named so Traefik can address it as http://standards-api:8000 over the
    # shared network below. See traefik/standards.toml.
    container_name: standards-api
    # No `ports:` at all. Traefik is the only way in, which means the
    # middleware on that route cannot be walked around by finding the port.
    #
    # If your Traefik is NOT a container on this host, it cannot resolve the
    # name above. Uncomment this and point the Traefik service at
    # http://127.0.0.1:8000 instead. Leave the address at 127.0.0.1 - binding
    # 0.0.0.0 publishes the unauthenticated API beside the authenticated route.
    # ports:
    #   - "${API_BIND:-127.0.0.1}:8000:8000"
    networks:
      - default      # reaches db
      - traefik      # reaches the proxy
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Demo fixtures. Behind a profile because running it DELETES everything that
  # is not a fixture - ingested standards sets, alignment records, the lot.
  # It exists for a fresh host you want something to look at on.
  seed:
    profiles: ["demo"]
    # Same image, different command.
    image: ghcr.io/sammorris-code/codeai-sprint-scaffold:${IMAGE_TAG:-main}
    environment:
      DATABASE_URL: postgresql://standards:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/standards
    command: ["python", "-m", "service.load_fixtures"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Load a pg_dump sitting beside this file. Also behind a profile, so a plain
  # `up -d` never touches your data:
  #
  #   docker compose -f docker-compose_public.yml --profile restore up restore
  #
  # The obvious alternative is mounting the dump into
  # /docker-entrypoint-initdb.d, and it is worse. That runs once, on the first
  # start of an empty volume, and is ignored ever after - so it automates the
  # step you do once and does nothing for the one you repeat, pushing a newer
  # dump up. Making it fire again means `down -v`, which destroys the volume
  # and everything a reviewer has done since. There is already one mechanism
  # in this file that silently reloads data under the right conditions, and it
  # ate an ingested standards set once. One is enough.
  #
  # This runs whenever you ask and never when you do not, which is the property
  # that matters.
  restore:
    profiles: ["restore"]
    # The postgres image for its client, not the service image - this only
    # needs psql.
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Read-only, and it must already exist. Docker silently creates a
      # DIRECTORY for a bind mount whose source is missing, and psql then fails
      # on it - which is ugly but loud, and better than the same mistake under
      # initdb.d, where you would get a healthy container and an empty store.
      - ./dump.sql:/tmp/dump.sql:ro
    # ON_ERROR_STOP is not decoration. Without it psql reports each failure and
    # carries on, so a dump written by PowerShell's `>` - UTF-16, not UTF-8 -
    # scrolls a hundred lines of `invalid command \th` and leaves you guessing
    # which one mattered. With it, the first bad byte stops the run.
    #
    # Make the dump with --clean --if-exists (see step 4 above) so this drops
    # and recreates rather than colliding with what is already there.
    command: ["psql", "-h", "db", "-U", "standards", "-d", "standards",
              "-v", "ON_ERROR_STOP=1", "-f", "/tmp/dump.sql"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

networks:
  # Traefik's own network, created by whatever brings Traefik up. `external`
  # means compose expects to find it rather than making one, so the name has to
  # match what is already there or you get:
  #
  #   network traefik declared as external, but could not be found
  #
  # It is rarely called `traefik`. Find yours in the Docker UI's network list -
  # it is the one with no stack against it - and name it in .env, not here:
  #
  #   TRAEFIK_NETWORK=t2_proxy
  #
  # Only the api joins it. The database stays on `default`, reachable from the
  # api and from nothing else.
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  pgdata:
