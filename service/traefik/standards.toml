# Traefik dynamic configuration for the standards service, for a file provider.
#
# TOML because that is what the setup this was verified against uses. Traefik's
# file provider reads .toml and .yml from the same directory, so either works -
# match whatever your existing rules files are and you will have one less thing
# to be wrong about. A YAML translation is at the bottom.
#
# ---------------------------------------------------------------------------
# Before you copy this, go and read a rules file that already works
# ---------------------------------------------------------------------------
#
# Three fields below are conventions, not rules, and they differ between
# installations. Getting any of them wrong produces a 404 that explains
# nothing:
#
#   entryPoints   "https" here. Plenty of setups call it "websecure".
#   certresolver  named. Some setups instead take a bare `tls = {}`.
#   middlewares   a CHAIN here. Many installations predefine chain-no-auth,
#                 chain-basic-auth, chain-oauth and so on, and expect you to
#                 reference one rather than declare your own middleware.
#
# Open any working file in your rules directory, copy those three verbatim, and
# change only the router name, the Host rule, the service name and the URL.
# That takes ten seconds and is faster than reasoning about it.
#
# ---------------------------------------------------------------------------
# Where this file goes
# ---------------------------------------------------------------------------
#
# The directory your file provider watches. Find it in Traefik's own
# configuration under `providers.file.directory`, or - if Traefik is configured
# with command-line flags and has no traefik.yml at all, which is normal for a
# NAS stack - look at the container's volume mounts for the host path behind
# the container's rules directory. On the NAS this was verified against:
#
#   /volume1/docker/traefik2/rules   ->   /rules
#
# With `watch: true` a new file loads in a second or two; no restart.
#
# If the provider is configured with `filename=` rather than `directory=`, it
# reads exactly one file and will never see this one. Add the router to that
# file instead.

[http.routers]
  [http.routers.standards-rtr]
    entryPoints = ["https"]
    rule = "Host(`standards.your-nas.example`)"
    service = "standards-svc"

    # Start with a no-auth chain and get a 200 out of /health first. Adding
    # authentication at the same time as the route means debugging two things
    # at once, and their failures look alike.
    middlewares = ["chain-basic-auth"]
    # middlewares = ["chain-no-auth"]

    [http.routers.standards-rtr.tls]
      certresolver = "dns-cloudflare"

[http.services]
  [http.services.standards-svc]
    [http.services.standards-svc.loadBalancer]
      passHostHeader = true
      [[http.services.standards-svc.loadBalancer.servers]]
        # The container name, not an IP and port. standards-api shares
        # Traefik's network and publishes no host port, so this route is the
        # only way in and the middleware above cannot be walked around.
        #
        # If your Traefik is NOT a container on this host it cannot resolve
        # that name. Uncomment the `ports:` line in docker-compose_public.yml
        # and use http://127.0.0.1:8000 here. Leave that binding on 127.0.0.1:
        # 0.0.0.0 publishes the unauthenticated API beside this route.
        url = "http://standards-api:8000"

# ---------------------------------------------------------------------------
# When it does not work
# ---------------------------------------------------------------------------
#
# The status code tells you which half is wrong, so read it before changing
# anything:
#
#   404   Traefik matched no router. The container has not been consulted at
#         all, so it is not a container problem. Either the file was not
#         loaded, the router failed to load, or the Host you requested is not
#         the Host in the rule - check for a typo and for a DNS record.
#   502   The router matched and Traefik cannot reach the container. Now it is
#         the network: confirm the api is up and on the same one as Traefik.
#   401   The route works and the middleware is doing its job.
#
# A router that names a middleware which does not exist is dropped silently,
# and the symptom is the 404 above. Commenting out a middleware definition
# while leaving the reference in place does exactly this.
#
# Do not guess between these. Ask Traefik:
#
#   the dashboard, HTTP -> Routers, search for your router name
#   docker exec traefik wget -qO- http://localhost:8080/api/http/routers
#   docker logs traefik 2>&1 | tail -50
#
# Absent from the router list means the file was not read. Present with an
# error says what is wrong with it. Present and healthy means the rule does not
# match what you are asking for.
#
# ---------------------------------------------------------------------------
# Why basic auth works here, when in front of an API it usually does not
# ---------------------------------------------------------------------------
#
# Put basic auth in front of an API that a page on ANOTHER origin calls and
# every write breaks. The browser sends a preflight OPTIONS first, preflights
# carry no credentials by design, basic auth answers 401, and the write fails
# as a CORS error that looks nothing like an authentication problem. The page
# cannot send the header itself either - that would mean a password committed
# to a public repository.
#
# It works here because the service serves the review tool as well as the API,
# so there is only one origin:
#
#   https://standards.your-nas.example/tools/standards-mapper/   the tool
#   https://standards.your-nas.example/api/...                   the API
#
# The viewer is prompted once, and the browser attaches those credentials to
# every call the page makes afterwards.
#
# Two things this depends on, so do not undo them casually:
#
#   - loader.js uses base '../../api', relative. An absolute URL to a different
#     HOST - a laptop checkout, or the GitHub Pages copy - is the broken case.
#   - app/main.py mounts the site at "/". Remove that and the tool has to be
#     served from somewhere else, which is cross-origin again.
#
# An address allowlist has none of these interactions and is worth preferring
# where everyone has a stable address:
#
#   [http.middlewares]
#     [http.middlewares.standards-allowlist.ipAllowList]
#       sourceRange = ["203.0.113.0/24", "198.51.100.42/32"]
#
# Whichever you use, app/main.py still sets allow_origins=["*"]. The middleware
# on this route is what stands in for that not being fixed.
#
# ---------------------------------------------------------------------------
# The same thing in YAML, if your rules directory is YAML
# ---------------------------------------------------------------------------
#
# http:
#   routers:
#     standards-rtr:
#       rule: "Host(`standards.your-nas.example`)"
#       entryPoints:
#         - https
#       service: standards-svc
#       middlewares:
#         - chain-basic-auth
#       tls:
#         certResolver: dns-cloudflare
#   services:
#     standards-svc:
#       loadBalancer:
#         passHostHeader: true
#         servers:
#           - url: "http://standards-api:8000"
#
# If you declare basic auth yourself rather than using a chain, note that in a
# file provider the bcrypt hash from `htpasswd -nbB user 'password'` goes in
# verbatim. The doubled dollar signs people remember are a Docker-label
# escaping rule; copying that habit here gives a hash that never matches.
